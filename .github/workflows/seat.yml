name: fullpod engine (Mage.Player.Seat)

# The fullpod branch: upstream XMage at a release tag + our engine commits +
# Mage.Player.Seat. Builds the engine and runs the seat harness on every push.
on:
  push:
    branches: [ "fullpod" ]
    tags: [ "pin/*" ]
  pull_request:
    branches: [ "fullpod" ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build the engine modules the seat needs
        run: mvn -B -q -DskipTests -Dmaven.build.cache.enabled=false install -pl Mage.Player.Seat -am
      - name: Seat harness
        run: mvn -B -Dmaven.build.cache.enabled=false test -pl Mage.Player.Seat
      - name: Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Mage.Player.Seat/target/surefire-reports/
          if-no-files-found: ignore
